<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Sistema de Créditos</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
    .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { background: #0056b3; }
    input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
    .result { margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 4px; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>🧪 Prueba Sistema de Créditos</h1>
  
  <div class="section">
    <h2>1. Consultar Saldo (getBalance)</h2>
    <input type="text" id="phoneBalance" placeholder="Teléfono (ej: 573146316831)" value="573146316831">
    <button onclick="testGetBalance()">Consultar Saldo</button>
    <div id="balanceResult" class="result"></div>
  </div>

  <div class="section">
    <h2>2. Solicitar Recarga (requestCreditPurchase)</h2>
    <input type="text" id="phonePurchase" placeholder="Teléfono" value="573146316831">
    <input type="number" id="amountPurchase" placeholder="Cantidad de créditos" value="500">
    <input type="text" id="paymentMethod" placeholder="Método de pago" value="nequi">
    <button onclick="testRequestPurchase()">Solicitar Recarga</button>
    <div id="purchaseResult" class="result"></div>
  </div>

  <div class="section">
    <h2>3. Solicitar Retiro (requestWithdrawal)</h2>
    <input type="text" id="phoneWithdraw" placeholder="Teléfono" value="573146316831">
    <input type="number" id="amountWithdraw" placeholder="Cantidad de créditos" value="5000">
    <input type="text" id="paymentMethodWithdraw" placeholder="Método de pago" value="nequi">
    <input type="text" id="accountNumber" placeholder="Número de cuenta" value="3146316831">
    <button onclick="testRequestWithdraw()">Solicitar Retiro</button>
    <div id="withdrawResult" class="result"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBHz3LsqwCDxQkhmUdj1E86kAYPXnQrkGg",
      authDomain: "footbet-pro.firebaseapp.com",
      projectId: "footbet-pro",
      storageBucket: "footbet-pro.firebasestorage.app",
      messagingSenderId: "768296334899",
      appId: "1:768296334899:web:708aa3e1883b0a89a2d546"
    };

    const app = initializeApp(firebaseConfig);
    const functions = getFunctions(app);

    window.testGetBalance = async () => {
      const phone = document.getElementById('phoneBalance').value;
      const resultDiv = document.getElementById('balanceResult');
      
      try {
        const getBalance = httpsCallable(functions, 'getBalance');
        const result = await getBalance({ phone });
        resultDiv.innerHTML = `<div class="success">✅ Éxito</div><pre>${JSON.stringify(result.data, null, 2)}</pre>`;
      } catch (error) {
        resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
      }
    };

    window.testRequestPurchase = async () => {
      const phone = document.getElementById('phonePurchase').value;
      const amount = parseInt(document.getElementById('amountPurchase').value);
      const paymentMethod = document.getElementById('paymentMethod').value;
      const resultDiv = document.getElementById('purchaseResult');
      
      try {
        const requestCreditPurchase = httpsCallable(functions, 'requestCreditPurchase');
        const result = await requestCreditPurchase({ phone, amount, paymentMethod });
        resultDiv.innerHTML = `<div class="success">✅ Éxito</div><pre>${JSON.stringify(result.data, null, 2)}</pre>`;
      } catch (error) {
        resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
      }
    };

    window.testRequestWithdraw = async () => {
      const phone = document.getElementById('phoneWithdraw').value;
      const amount = parseInt(document.getElementById('amountWithdraw').value);
      const paymentMethod = document.getElementById('paymentMethodWithdraw').value;
      const accountNumber = document.getElementById('accountNumber').value;
      const resultDiv = document.getElementById('withdrawResult');
      
      try {
        const requestWithdrawal = httpsCallable(functions, 'requestWithdrawal');
        const result = await requestWithdrawal({ phone, amount, paymentMethod, accountNumber });
        resultDiv.innerHTML = `<div class="success">✅ Éxito</div><pre>${JSON.stringify(result.data, null, 2)}</pre>`;
      } catch (error) {
        resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
      }
    };
  </script>
</body>
</html>
